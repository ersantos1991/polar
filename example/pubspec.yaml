name: polar_example
description: Demonstrates how to use the polar plugin.
publish_to: none

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_reactive_ble: 5.5.0
  polar:
    path: ../

  shared_preferences: ^2.5.3
  uuid: ^4.0.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  rexios_lints: ^16.0.0

dependency_overrides:
  reactive_ble_mobile: 5.5.0

flutter:
  uses-material-design: true
